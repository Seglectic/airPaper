openapi: "3.0.2"

info:
  title: "Paperless Parts API"
  description: "
The Paperless Parts API provides access to your data, enabling developers to easily integrate Paperless Parts with third-party systems, such as Customer Relationship Management (CRM) and Enterprise Resource Planning (ERP) tools. The API is designed to support two primary use case. First, reading all information associated with a particular order or quote for import into another system. Second, managing customer data, either for an initial bulk import or for on-going synchronization with an external database.

## Authorization ##

Requests are authorized via an API key. Administrators of a Paperless Parts account can generate an API Token which grants access to all of the endpoints documented here. The token obtained from the application must be added to the header of all requests using the key `\"Authorization\"` with the value `\"API-Token <api_token>\"`, where `<api_token>` is your Paperless Parts API Token.


You can use the \"Execute\" button in an endpoint's documentation on this page to try out the endpoint. This will send a request to the endpoint on the Paperless Parts server and display the result on this page. Before doing so, however, you'll need to click on the 'Authorize' button at the top of the screen, and in the \"Value\" field enter `\"API-Token <api_token>\"`, where `<api_token>` is your API token as described above.


## Overview ##

The API endpoints are organized around REST. API calls should be made to the `https://api.paperlessparts.com` base domain. URLs are designed to clearly describe an entity or collection of entities. HTTP verbs typically describe whether entities are being read, created, modified, or deleted. Where applicable, request and response bodies are in JSON format. Standard HTTP response codes, in addition to error messages, are used to help explain request failures.

### Associations

Many entities in the API data model are associated with other entities. As a guiding principle, `GET` requests that fetch data nest associated entities in the JSON response. However, when creating or modifying entities, a flat (non-nested) object must be provided, as explained in the documentation for each endpoint. Associations are specified when writing data by using entity IDs in fields ending in `_id`.


For example, consider the relationship where a Company has many Customers. When fetching a Customer via a `GET` request, the associated Company will be nested as an object with key `company` in the response. When creating a Customer, the Company is specified via its integer id using the key `company_id`.

### HTTP Methods

The API endpoints support different HTTP methods depending on whether records are being read, created, or updated. To read an entity, use `GET`. To create a new entity, use `POST`. To modifying an entity, use `PATCH`. Note, `PATCH` is used rather than `PUT` to indicate that entities can be partially updated. In other words, in general, if a field is omitted from a `PATCH` request, that field's value will stay the same (rather than be set to `null`). All fields requiring values are required to be included in `POST` requests.

> Note: Endpoints with a documented `PATCH` method can generally be used with a `PUT` method. The `PUT` is implemented as a partial update (as opposed to a replacement) and is supported for maximum compatibilty.


For example, consider the `email` field on the Customer entity, which is required. All Customers must have a non-null `email`. When creating a Customer via `POST`, the request body must contain an `email` key and its value cannot be `null` (other validation applies to that field, as well, including a valid email format and a unique value). When editing a Customer via `PATCH` request, it is not necessary to include an `email` key in the request body. If `email` is omitted, the existing email address will not be changed. If you send a `PATCH` request with `email=null`, then you will receive an error response indicating that a value for `email` is required."
  version: "1.0"
  termsOfService: "https://www.paperlessparts.com/web-service-agreement/"
  contact:
    name: "Paperless Parts"
    url: "https://www.paperlessparts.com"
    email: "support@paperlessparts.com"

security:
  - app_id: []

servers:
  - url: "https://api.paperlessparts.com/"

tags:
  - name: Orders
    description: Endpoints for identifying newly placed orders and pulling all information related to a particular order. Also, a new order can be created via open API to turn an existing quote into order.
  - name: Quotes
    description: Endpoints for identifying newly sent quotes, pulling all information related to a particular quote, and updating a quote's status.
  - name: Customers
    description: "
Paperless Parts includes Customer Relationship Management (CRM) functionality to make it easy to send quotes to new and existing customers, while keeping data consistent with third-party CRM and ERP systems. Typical use cases for these endpoints are to bulk import customers from an existing customer database and to synchronize new customers or changes from another system.


An account represents a single company or account to which you would send quotes. An account has zero or more Contacts, each of which represents a person at that company and is identified uniquely by their email address. An account also has facilities and billing addresses. Facilities represent destinations to which orders can be shipped and BillingAddresses represent the bill to address for and order."
  - name: Custom Tables
    description: Endpoints for managing custom tables used by Operations to compute pricing.
  - name: Purchased Components
    description: Endpoints for managing purchased components and purchased components columns.
  - name: Integration Actions
    description: Endpoints for interacting with ERP integrations 
paths:
  /quotes/public/new:
    get:
      summary: "List new quote numbers and revisions"
      description: "List the numbers and revisions of new quotes that have been sent. If the number and (optional) revision of the last known sent quote is supplied, this endpoint will return a list of the numbers and revisions of the quotes sent after the specified quote. If no number is provided, this endpoint will return a list of the numbers and revisions of all sent quotes. Note that the quote numbers will be returned in the order the quotes were sent, not necessarily in ascending numerical order."
      operationId: 'NewQuoteNumbers'
      parameters:
        - $ref: '#/components/parameters/last_quote'
        - $ref: '#/components/parameters/revision'
      tags:
        - Quotes
      responses:
        200:
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteNumberArray'
        404:
          description: Not found response
          content:
            text/plain:
              schema:
                title: Quote not found
                type: string
                example: "Error: Not Found"



  /quotes/public/{quoteNumber}:
    get:
      summary: "Get quote details"
      description: "Get the details for a specific quote."
      operationId: 'QuoteDetails'
      parameters:
        - $ref: '#/components/parameters/quoteNumber'
        - $ref: '#/components/parameters/revisionNumber'
      tags:
        - Quotes
      responses:
        200:
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        404:
          description: Not found response
          content:
            text/plain:
              schema:
                title: Quote not found
                type: string
                example: "Error: Not Found"
    patch:
      summary: "Update fields on a Quote"
      description: "Update fields on a Quote."
      operationId: 'UpdateQuote'
      parameters:
        - $ref: '#/components/parameters/quoteNumber'
        - $ref: '#/components/parameters/revisionNumber'
      tags:
        - Quotes
      responses:
        200:
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                erp_code:
                  type: string
                  nullable: true
                  description: The unique identifier of the corresponding quote record in the ERP system, cast to a string.
                  example: "1234"
  /quotes/public/{quoteNumber}/status_change:
    patch:
      summary: "Update a quote's status"
      description: "Update a specific quote's status."
      operationId: 'SetQuoteStatus'
      parameters:
        - $ref: '#/components/parameters/quoteNumber'
        - $ref: '#/components/parameters/revisionNumber'
      tags:
        - Quotes
      responses:
        200:
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  nullable: true
                  description: the status of the quote. Available statuses are "oustanding", "cancelled", "lost", and "trash"
                  example: "outstanding"



  /orders/public/new:
    get:
      summary: "List new order numbers"
      description: "List the numbers of new orders that have been created. If the number of the last known order is supplied, this endpoint will return a list of the numbers of the orders created after the specified order. If no number is provided, this endpoint will return a list of all available order numbers."
      operationId: 'NewOrderNumbers'
      parameters:
        - $ref: '#/components/parameters/last_order'
      tags:
        - Orders
      responses:
        200:
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderNumberArray'
        404:
          description: Not found response
          content:
            text/plain:
              schema:
                title: Order not found
                type: string
                example: "Error: Not Found"

  /orders/public/{orderNumber}:
    get:
      summary: "Get order details"
      description: "Get the details for a specific order."
      operationId: 'OrderDetails'
      parameters:
        - $ref: '#/components/parameters/orderNumber'
      tags:
        - Orders
      responses:
        200:
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        404:
          description: Not found response
          content:
            text/plain:
              schema:
                title: Quote not found
                type: string
                example: "Error: Not Found"
    patch:
      summary: "Update fields on an Order"
      description: "Update fields on an Order."
      operationId: 'UpdateOrder'
      parameters:
        - $ref: '#/components/parameters/orderNumber'
      tags:
        - Orders
      responses:
        200:
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                erp_code:
                  type: string
                  nullable: true
                  description: The unique identifier of the corresponding order record in the ERP system, cast to a string.
                  example: "1234"

  /orders/public/facilitate_order:
    post:
      summary: "Create an order from a quote"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FacilitateOrderBody'
      tags:
        - Orders
      responses:
        200:
          description: Successful response

        404:
          description: Not found response


  /contacts/public:
    get:
      summary: List contacts
      description:
        "Returns a list of contacts. The contacts are returned 20 results at a time and can be iterated over by using the page parameter."
      operationId: ListContacts
      parameters:
        - in: query
          name: search
          schema:
            type: string
          required: False
          description: "Value used to search against the following fields: email, first name, last name, notes, phone, and account_id. Comparisons are not case sensitive and will match when the field value includes the search value as a substring."
        - in: query
          name: page
          schema:
            type: string
          required: False
          description: "The page of results to return."
        - in: query
          name: account_id
          schema:
            type: integer
          required: false
          description: The id of the account who's contacts to return. Must be an exact match.
          example: 17'
      tags:
        - Customers
      responses:
        200:
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    account_id:
                      type: integer
                      example: 17
                      nullable: true
                      description: the ID of the associated Account
                    created:
                      type: string
                      example: "2020-08-25T18:00:53+00:00"
                    email:
                      type: string
                      example: careers@paperlessparts.com
                      description: email address (must be non-null, unique across all Contacts, and a valid email format)
                    first_name:
                      type: string
                      example: Gordon
                      description: Contact first name (must be non-null)
                    id:
                      type: integer
                      example: 137
                    last_name:
                      type: string
                      example: Moore
                      description: Contact last name (must be non-null)
                    phone:
                      type: string
                      nullable: true
                      example: "6176354500"
                      description: Contact phone number
                    phone_ext:
                      type: string
                      nullable: true
                      example: null
                      description: Contact phone number extension
        404:
          description: Not found response
          content:
            text/plain:
              schema:
                title: Customers not found
                type: string
                example: "Error: Not Found"
    post:
      summary: Create new contact
      description: Creates a new contact.
      operationId: CreateContact
      tags:
        - Customers
      responses:
        201:
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                account_id:
                  type: integer
                  nullable: true
                  description: the ID of the associated Account
                  example: 137
                address:
                  type: object
                  description: the contact's address
                  nullable: true
                  properties:
                    address1:
                      type: string
                      nullable: false
                      description: The street address
                      example: 137 Portland St.
                    address2:
                      type: string
                      nullable: true
                      description: Unit #
                      example: Unit 1
                    city:
                      type: string
                      nullable: false
                      description: The city of the address
                      example: Boston
                    country:
                      type: string
                      nullable: false
                      description: The three character country abbreviation
                      example: USA
                    postal_code:
                      type: string
                      nullable: false
                      description: The postal code for the address
                      example: "02114"
                    state:
                      type: string
                      nullable: false
                      description: The two character state abbreviation
                      example: MA
                email:
                  type: string
                  nullable: false
                  description: email address (must be non-null, unique across all Contacts, and a valid email format)
                  example: careers@paperlessparts.com
                first_name:
                  type: string
                  nullable: false
                  description: Contact first name (must be non-null)
                  example: Gordon
                last_name:
                  type: string
                  nullable: false
                  description: Contact last name (must be non-null)
                  example: Moore
                notes:
                  type: string
                  nullable: true
                  description: Contact notes
                phone:
                  type: string
                  nullable: true
                  example: "6176354500"
                  description: Customer phone number
                phone_ext:
                  type: string
                  nullable: true
                  example: null
                  description: Customer phone number extension
                salesperson:
                  type: object
                  description: the contacts salesperson
                  nullable: true
                  properties:
                    email:
                      type: string
                      nullable: false
                      description: The salespersons email address. Must correspond to an active team member in your Paperless Parts account.
                      example: "careers@paperlessparts.com"


  /contacts/public/{contactId}:
    get:
      summary: Get details about a Contact
      description: Get all Contact attributes
      operationId: ContactDetails
      parameters:
        - $ref: '#/components/parameters/contactId'
      tags:
        - Customers
      responses:
        200:
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
    patch:
      summary: Update a Contact
      description: Partially update Contact attributes (not including associated entities)
      operationId: UpdateCustomer
      parameters:
        - $ref: '#/components/parameters/contactId'
      tags:
        - Customers
      responses:
        200:
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                account_id:
                  type: integer
                  nullable: true
                  description: the ID of the associated Account
                  example: 137
                address:
                  type: object
                  description: The contact's address. If an address exists on a customer then individual fields can be patched, otherwise all fields are required
                  nullable: true
                  properties:
                    address1:
                      type: string
                      nullable: false
                      description: The street address
                      example: 137 Portland St.
                    address2:
                      type: string
                      nullable: true
                      description: Unit #
                      example: Unit 1
                    city:
                      type: string
                      nullable: false
                      description: The city of the address
                      example: Boston
                    country:
                      type: string
                      nullable: false
                      description: The three character country abbreviation
                      example: USA
                    postal_code:
                      type: string
                      nullable: false
                      description: The postal code for the address
                      example: "02114"
                    state:
                      type: string
                      nullable: false
                      description: The two character state abbreviation
                      example: MA
                email:
                  type: string
                  nullable: false
                  description: email address (must be non-null, unique across all Contacts, and a valid email format)
                  example: careers@paperlessparts.com
                first_name:
                  type: string
                  nullable: false
                  description: Contact first name (must be non-null)
                  example: Gordon
                last_name:
                  type: string
                  nullable: false
                  description: Contact last name (must be non-null)
                  example: Moore
                notes:
                  type: string
                  nullable: true
                  description: Contact notes
                phone:
                  type: string
                  nullable: true
                  example: "6176354500"
                  description: Customer phone number
                phone_ext:
                  type: string
                  nullable: true
                  example: null
                  description: Customer phone number extension
                salesperson:
                  type: object
                  description: the contacts salesperson
                  nullable: true
                  properties:
                    email:
                      type: string
                      nullable: false
                      description: The salespersons email address. Must correspond to an active team member in your Paperless Parts account.
                      example: "careers@paperlessparts.com"
            example:
              phone: "6176354500"

  /accounts/public:
    get:
      summary: List accounts
      description: "Returns a list of accounts. The accounts are returned 20 results at a time and can be iterated over by using the page parameter."
      operationId: ListAccounts
      parameters:
        - in: query
          name: search
          schema:
            type: string
          required: False
          description: "Value used to search against the following fields: account name, erp code, notes, and id. Comparisons are not case sensitive and will match when the field value includes the search value as a substring."
        - in: query
          name: page
          schema:
            type: string
          required: False
          description: "The page of results to return."
        - in: query
          name: erp_code
          schema:
            type: string
          required: False
          description: The erp code of the accounts to return. Must be an exact match.
          example: 'PPI'
        - in: query
          name: null_erp_code
          schema:
            type: boolean
          required: False
          description: Filters for accounts whose erp code is either null or an empty string.
          example: True
      tags:
        - Customers
      responses:
        200:
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                      example: Paperless Parts, Inc.
                      description: The name of the account
                    erp_code:
                      type: string
                      example: PPI
                      description: The ERP code of the account
                    id:
                      type: integer
                      example: 17
                      description: the ID of the account
                    phone:
                      type: string
                      example: "6176354500"
                      description: Account phone number
                    phone_ext:
                      type: string
                      example: null
                      description: Account phone number extension
                    type:
                      type: string
                      example: customer
                      description: Account type, either customer or vendor
        404:
          description: Not found response
          content:
            text/plain:
              schema:
                title: Accounts not found
                type: string
                example: "Error: Not Found"
    post:
      summary: Create new Account
      description: Creates a new account.
      operationId: CreateAccoumt
      tags:
        - Customers
      responses:
        201:
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  nullable: false
                  description: (Required) Account Name (must be non-null and non-blank)
                  example: Paperless Parts, Inc.
                credit_line:
                  type: number
                  nullable: True
                  description: An account's credit line
                  example: 10000.00
                erp_code:
                  type: string
                  nullable: True
                  description: Erp code for the account
                  example: PPI
                notes:
                  type: string
                  nullable: true
                  description: Account notes
                payment_terms:
                  type: string
                  nullable: true
                  description: Payment terms; required if `payment_terms_period` are included
                  example: "Net 30"
                payment_terms_period:
                  type: string
                  nullable: true
                  description: Payment terms period in days; required if `payment_terms` are included, but can be `null`
                  example: 30
                phone:
                  type: string
                  nullable: true
                  example: "6176354500"
                  description: Account phone number
                phone_ext:
                  type: string
                  nullable: true
                  example: null
                  description: Account phone number extension
                purchase_orders_enabled:
                  type: boolean
                  example: true
                  nullable: false
                  description: When `true` any contact associated with this account will be allowed to check out with a purchase order.
                salesperson:
                  type: object
                  description: the accounts salesperson
                  nullable: true
                  properties:
                    email:
                      type: string
                      nullable: false
                      description: The salespersons email address. Must correspond to an active team member in your Paperless Parts account.
                      example: "careers@paperlessparts.com"
                sold_to_address:
                  type: object
                  description: The address for the account's headquarters.
                  nullable: true
                  properties:
                    address1:
                      type: string
                      nullable: false
                      description: The street address
                      example: 137 Portland St.
                    address2:
                      type: string
                      nullable: true
                      description: Unit #
                      example: Unit 1
                    city:
                      type: string
                      nullable: false
                      description: The city of the address
                      example: Boston
                    country:
                      type: string
                      nullable: false
                      description: The three character country abbreviation
                      example: USA
                    postal_code:
                      type: string
                      nullable: false
                      description: The postal code for the address
                      example: "02114"
                    state:
                      type: string
                      nullable: false
                      description: The two character state abbreviation
                      example: MA
                    erp_code:
                      type: string
                      maxLength: 50
                      description: The unique identifier for this address record in the ERP
                      example: B1234
                tax_exempt:
                  type: boolean
                  nullable: false
                  example: true
                  description: When `true`, sales tax will not be added to a quote
                tax_rate:
                  type: number
                  nullable: true
                  example: 6.25
                  description: Sales tax rate for this Account
                type:
                  type: string
                  nullable: false
                  example: customer
                  description: Type of this Account, either customer or vendor
                url:
                  type: string
                  nullable: true
                  example: https://paperlessparts.com
            example:
              credit_line: 100000
              erp_code: "PPI"
              purchase_orders_enabled: true
              name: "Paperless Parts, Inc."
              notes: "This is a test account"
              tax_exempt: true
              tax_rate: 6.25
              phone: "6175555555"
              url: "www.paperlessparts.com"
              type: "customer"

  /accounts/public/{accountId}:
    get:
      summary: Get details about an Account
      description: Get all Account attributes, including a list of billing addresses.
      operationId: AccountDetails
      parameters:
        - $ref: '#/components/parameters/accountId'
      tags:
        - Customers
      responses:
        200:
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        404:
          description: Not found response
          content:
            text/plain:
              schema:
                title: Account not found
                type: string
                example: "Error: Not Found"
    patch:
      summary: Update an Account
      description: Partially update Account attributes (not including associated entities)
      operationId: UpdateCompany
      parameters:
        - $ref: '#/components/parameters/accountId'
      tags:
        - Customers
      responses:
        200:
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  nullable: false
                  description: (Required) Account Name (must be non-null and non-blank)
                  example: Paperless Parts, Inc.
                credit_line:
                  type: number
                  nullable: True
                  description: An account's credit line
                  example: 10000.00
                erp_code:
                  type: string
                  nullable: True
                  description: Erp code for the account
                  example: PPI
                notes:
                  type: string
                  nullable: true
                  description: Account notes
                payment_terms:
                  type: string
                  nullable: true
                  description: Payment terms; required if `payment_terms_period` are included
                  example: "Net 30"
                payment_terms_period:
                  type: string
                  nullable: true
                  description: Payment terms period in days; required if `payment_terms` are included, but can be `null`
                  example: 30
                phone:
                  type: string
                  nullable: true
                  example: "6176354500"
                  description: Account phone number
                phone_ext:
                  type: string
                  nullable: true
                  example: null
                  description: Account phone number extension
                purchase_orders_enabled:
                  type: boolean
                  example: true
                  nullable: false
                  description: When `true` any contact associated with this account will be allowed to check out with a purchase order.
                salesperson:
                  type: object
                  description: the accounts salesperson
                  nullable: true
                  properties:
                    email:
                      type: string
                      nullable: false
                      description: The salespersons email address. Must correspond to an active team member in your Paperless Parts account.
                      example: "careers@paperlessparts.com"
                sold_to_address:
                  type: object
                  description: The address for the account's headquarters. If a sold_to_address is present on the account then individual fields can be patched otherwise all fields are required.
                  nullable: true
                  properties:
                    address1:
                      type: string
                      nullable: false
                      description: The street address
                      example: 137 Portland St.
                    address2:
                      type: string
                      nullable: true
                      description: Unit #
                      example: Unit 1
