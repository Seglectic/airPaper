    FacilitateOrderBody:
      type: object
      description: "Data representing a Quote that will be used to generate an Order. This endpoint provides an alternative to the checkout flow in the app. For each quote item you'd like to check out for, specify the quantity and unit price. Note that you may submit an arbitrary quantity and arbitrary unit price; you are not restricted to the options on the quote.
        \n\n
        NOTE: shipping_info, billing_info and shipping_option are optional.
      "
      properties:
        number:
          type: integer
        quantity_data:
          type: array
          items:
            type: object
            properties:
              quote_item_id:
                type: integer
              quantity:
                type: integer
              unit_price:
                type: number
                format: float
              add_ons:
                type: array
                description: "If you'd like to apply add-ons, specify the ID of the AddOn you'd like to apply (not the ID of the AddOnQuantity). If you've selected an existing quantity and unit price for this quote item, the corresponding existing AddOnQuantity will be used. If you've specified a nonexistent quantity and/or unit price, a new AddOnQuantity will be created with the supplied manual_price."
                items:
                  type: object
                  properties:
                    add_on_id:
                      type: integer
                    manual_price:
                      type: number
                      format: float
                      nullable: true
                      description: "There is no need to supply this field if you have selected an existing quantity and unit_price for this quote item."
              expedite_id:
                type: integer
                nullable: true
                description: ""
        shipping_info:
          type: object
          nullable: true
          properties:
            business_name:
              type: string
            first_name:
              type: string
            last_name:
              type: string
            phone:
              type: string
            phone_ext:
              type: string
            address:
              type: object
              properties:
                address1:
                  type: string
                address2:
                  type: string
                postal_code:
                  type: string
                city:
                  type: string
                state:
                  type: object
                  properties:
                    abbr:
                      type: string
                country:
                  type: object
                  properties:
                    abbr:
                      type: string
        billing_info:
          type: object
          nullable: true
          properties:
            business_name:
              type: string
            first_name:
              type: string
            last_name:
              type: string
            phone:
              type: string
            phone_ext:
              type: string
            address:
              type: object
              properties:
                address1:
                  type: string
                address2:
                  type: string
                postal_code:
                  type: string
                city:
                  type: string
                state:
                  type: object
                  properties:
                    abbr:
                      type: string
                country:
                  type: object
                  properties:
                    abbr:
                      type: string
        shipping_option:
          nullable: true
          type: object
          properties:
            type:
              type: string
              enum: ['pickup', 'customers_shipping_account', 'suppliers_shipping_account']
            shipping_method:
              type: string
              enum: ['early_am_overnight', 'next_day_air', 'second_day_air', 'ground']
            ship_when:
              type: string
              enum: ['when_ready', 'all_at_once']
