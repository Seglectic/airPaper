          schema:
            type: string
          required: True
          description: "The unique identifier for the integration action to be returned"
      tags:
        - Integration Actions
      responses:
        200:
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationAction'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  example: "in_progress"
                  description: the new status of the integration action
                status_message:
                  type: string
                  example: "The order 8 is now processing"
                  description: The new status message for the integration
              

components:
  securitySchemes:
    app_id:
      type: apiKey
      description: "API key to authorize requests."
      name: Authorization
      in: header

  parameters:
    last_quote:
      name: last_quote
      in: query
      description: "**Last known sent quote number**. You may supply the number of the last known quote."
      schema:
        $ref: '#/components/schemas/QuoteNumber'
    revision:
      name: revision
      in: query
      description: "**Last known sent quote revision number**. You may supply the revision number of the last known quote."
      schema:
        $ref: '#/components/schemas/RevisionNumber'
    quoteNumber:
      name: quoteNumber
      in: path
      description: "The quote number"
      required: true
      schema:
        $ref: '#/components/schemas/QuoteNumber'
    revisionNumber:
      name: revision
      in: query
      description: "The (optional) quote revision number"
      required: false
      schema:
        $ref: '#/components/schemas/RevisionNumber'
    last_order:
      name: last_order
      in: query
      description: "**Last known order number**. You may supply the number of the last known order."
      schema:
        $ref: '#/components/schemas/OrderNumber'
    orderNumber:
      name: orderNumber
      in: path
      description: "The order number"
      required: true
      schema:
        $ref: '#/components/schemas/OrderNumber'
    accountLocator:
      name: accountLocator
      in: path
      description: "The text identifier (slug) for the account"
      required: true
      schema:
        $ref: '#/components/schemas/AccountLocator'
    tableName:
      name: tableName
      in: path
      description: "The name of the table"
      required: true
      schema:
        $ref: '#/components/schemas/TableName'
    contactId:
      name: contactId
      in: path
      description: The integer idenfier of a Contact, assigned automatically by Paperless Parts
      required: true
      schema:
        $ref: '#/components/schemas/CustomerId'
    erp_code:
      name: erp_code
      in: query
      description: The erp code of the company to retrieve
      example: "PPI"
      schema:
        $ref: '#/components/schemas/ErpCode'
    accountId:
      name: accountId
      in: path
      required: true
      example: 17
      schema:
        $ref: '#/components/schemas/AccountId'
    billingAddressId:
      name: billingAddressId
      in: path
      required: true
      example: 27
      schema:
        $ref: '#/components/schemas/BillingAddressId'
    facilityId:
      name: facilityId
      in: path
      required: true
      example: 30
      schema:
        $ref: '#/components/schemas/FacilityId'
    purchasedComponentsColumnId:
      name: purchasedComponentsColumnId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/PurchasedComponentsColumnId'
    purchasedComponentId:
      name: purchasedComponentId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/PurchasedComponentId'


  schemas:
    AccountLocator:
      type: string
      description: "The text identifier (slug) for the account"
      example: acme-machining
    TableName:
      type: string
      description: "The name of the table"
      example: sample_table
    AccountId:
      type: integer
      description: "The account id"
      example: '13'
    BillingAddressId:
      type: integer
      description: "The billing address id"
      example: '27'
    CustomerId:
      type: integer
      description: "The customer id"
      example: '32'
    ErpCode:
      type: string
      description: "The erp code for a comapny"
      example: 'PPI'
    FacilityId:
      type: integer
      description: "The facility id"
      example: '30'
    QuoteNumber:
      type: integer
      description: "A unique identifier for a Quote"
      example: 37
    RevisionNumber:
      type: integer
      description: "A unique revision number for a Quote. May be null."
      example: 1
    QuoteRevisionPair:
      type: object
      properties:
        quote:
          $ref: '#/components/schemas/QuoteNumber'
        revision_number:
          $ref: '#/components/schemas/RevisionNumber'
    QuoteNumberArray:
      type: array
      items:
        $ref: '#/components/schemas/QuoteRevisionPair'
    ManagedIntegration:
      type: object
      properties:
        erp_name:
          type: string
          example: "JobBOSS"
          description: The name of the ERP being integrated with
        is_active:
          type: boolean
          example: True
          description: whether the integration is active
        erp_version:
          type: string
          example: "1.0"
          description: The version of the ERP system being integrated with
        integration_version:
          type: string
          example: "1.0"
          description: The version of the codebase processing the integration
        create_integration_action_after_creating_new_order:
          type: boolean
          example: True
          description: Whether a new integration action should be created after a new order is faciliated in Paperless
        create_integration_action_after_quote_sent:
          type: boolean
          example: True
          description: Whether a new integration action should be created after a new quote is sent in Paperless
    ManagedIntegrationDetails:
      allOf:
        - $ref: '#/components/schemas/ManagedIntegration'
        - type: object
          properties:
            id:
              type: integer
              example: 42124
    IntegrationAction:
      type: object
      properties:
        action_type:
            type: string
            example: "export_order"
            description: the type of action being requested
        action_uuid:
          type: string
          example: "ff27bec2-ff2a-49b8-93fe-1a6c1b8f9f39"
          description: the id for action
        status:
          type: string
          example: "in_progress"
          description: The current status of the action
        status_message:
          type: string
          example: "Order 8 is currently being processed"
        entity_id:
          type: string
          example: "8"
          description: The identifier for the entity that should be processed as part of the action. For example, process order 8   
    PurchasedComponentProperty:
      type: object
      properties:
        name:
          type: string
          description: "Name of corresponding purchased component column in table display"
        code_name:
          type: string
          description: "Name used to access property within pricing formulas via 'dot' operator"
        value_type:
          type: string
          enum: ['string', 'boolean', 'numeric']
        value:
          anyOf:
            - type: string
            - type: number
            - type: boolean
          nullable: true
          description: "Value of property, None or of type corresponding to value_type"
    PurchasedComponentCustomProperty:
      type: object
      properties:
        key:
          type: string
          description: "Name of corresponding purchased component column in table display"
          example: property name
        value:
          anyOf:
            - type: string
            - type: number
            - type: boolean
          nullable: true
          description: "Value of property, None or of type corresponding to value_type"
          example: really cool value
    AbstractPurchasedComponent:
      type: object
      properties:
        oem_part_number:
          type: string
          description: "Unique identifier for purchased component within a supplier account"
          example: "064-1235"
        internal_part_number:
          type: string
          nullable: true
          example: a
        description:
          type: string
          nullable: true
          example: any text you want
        piece_price:
          type: number
          format: decimal
          nullable: false
          description: "Cost per piece to 4 decimal places"
          example: 2.0000
    PostPurchasedComponent:
      allOf:
        - $ref: '#/components/schemas/AbstractPurchasedComponent'
        - type: object
          properties:
            properties:
              type: array
              items:
                $ref: '#/components/schemas/PurchasedComponentCustomProperty'
          required:
            - oem_part_number
            - piece_price
            - properties
    PatchPurchasedComponent:
      allOf:
        - $ref: '#/components/schemas/AbstractPurchasedComponent'
        - type: object
          properties:
            properties:
              type: array
              items:
                $ref: '#/components/schemas/PurchasedComponentCustomProperty'
    PurchasedComponent:
      allOf:
